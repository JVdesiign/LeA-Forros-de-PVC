<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f9fbfc"/><stop offset="1" stop-color="#eef4f7"/>
  </linearGradient>
  <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#edf1f3"/><stop offset="1" stop-color="#d9e0e4"/>
  </linearGradient>
  <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#dfe5e8"/><stop offset="1" stop-color="#aeb9c0"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="170%" height="190%">
    <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#082f57" flood-opacity=".2"/>
  </filter>
</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<g filter="url(#shadow)" transform="translate(90 110)">
  <!-- lower flange -->
  <path d="M110 485 L790 245 L1015 365 L335 610 Z" fill="url(#top)" stroke="#c8d1d7" stroke-width="4"/>
  <!-- central web -->
  <path d="M200 385 L880 145 L880 300 L200 542 Z" fill="url(#side)" stroke="#aab5bc" stroke-width="4"/>
  <!-- upper flange -->
  <path d="M105 310 L785 70 L1010 190 L330 435 Z" fill="url(#top)" stroke="#c8d1d7" stroke-width="4"/>
  <!-- open H channels -->
  <path d="M330 435 L1010 190 L1010 235 L330 480 Z" fill="#c7d0d5" opacity=".95"/>
  <path d="M335 610 L1015 365 L1015 410 L335 655 Z" fill="#b8c2c8" opacity=".95"/>
  <path d="M200 542 L880 300 L880 345 L200 588 Z" fill="#9faab1" opacity=".88"/>
</g>
</svg>