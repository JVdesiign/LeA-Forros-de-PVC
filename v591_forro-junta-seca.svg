<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#eef4f7"/>
  </linearGradient>
  <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f8f9fa"/><stop offset="1" stop-color="#e9edf0"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#dce2e6"/><stop offset="1" stop-color="#aeb8bf"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#082f57" flood-opacity=".18"/>
  </filter>
</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<g filter="url(#shadow)" transform="translate(90 135)">
  <!-- bottom panel -->
  <path d="M125 445 L800 265 L985 365 L310 548 Z" fill="url(#face)" stroke="#cbd3d8" stroke-width="4"/>
  <path d="M310 548 L985 365 L985 410 L310 595 Z" fill="url(#edge)" stroke="#aab4bb" stroke-width="3"/>
  <!-- middle panel -->
  <path d="M85 320 L760 140 L945 240 L270 424 Z" fill="url(#face)" stroke="#cbd3d8" stroke-width="4"/>
  <path d="M270 424 L945 240 L945 285 L270 470 Z" fill="url(#edge)" stroke="#aab4bb" stroke-width="3"/>
  <!-- top panel -->
  <path d="M45 195 L720 15 L905 115 L230 300 Z" fill="url(#face)" stroke="#cbd3d8" stroke-width="4"/>
  <path d="M230 300 L905 115 L905 160 L230 345 Z" fill="url(#edge)" stroke="#aab4bb" stroke-width="3"/>
  <!-- hollow cells at cut end -->
  <g transform="translate(229 300) skewY(-15)">
    <rect x="0" y="0" width="675" height="44" fill="#c4ccd1" opacity=".9"/>
    <g fill="#f6f8f9" stroke="#aab4bb" stroke-width="2">
      <rect x="18" y="6" width="60" height="30" rx="3"/>
      <rect x="91" y="6" width="60" height="30" rx="3"/>
      <rect x="164" y="6" width="60" height="30" rx="3"/>
      <rect x="237" y="6" width="60" height="30" rx="3"/>
      <rect x="310" y="6" width="60" height="30" rx="3"/>
      <rect x="383" y="6" width="60" height="30" rx="3"/>
      <rect x="456" y="6" width="60" height="30" rx="3"/>
      <rect x="529" y="6" width="60" height="30" rx="3"/>
    </g>
  </g>
</g>
</svg>